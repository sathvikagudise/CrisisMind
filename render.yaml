services:
  - type: web
    name: crisismind-backend
    runtime: docker
    plan: standard          # DistilBERT + EfficientNet + PyTorch need >= 2 GB RAM
    region: oregon          # change if you prefer another region
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
